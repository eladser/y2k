name: pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm test

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm test
      - name: stamp the commit into the page
        run: |
          sed -i -e "s|data-sha=\"\"|data-sha=\"$GITHUB_SHA\"|" \
            -e "s|data-built=\"\"|data-built=\"$(date -u +%FT%TZ)\"|" \
            site/index.html
      - uses: actions/upload-pages-artifact@v4
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
