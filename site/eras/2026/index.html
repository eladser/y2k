<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halcyon · Fly somewhere that feels like June</title>
<meta name="color-scheme" content="dark">
<link rel="preload" href="mona-sans.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="ai.css">
<script type="module" src="ai.js"></script>
</head>
<body>

<svg class="defs" aria-hidden="true">
  <filter id="lens" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".006 .011" numOctaves="2" seed="7" result="n"/>
    <feGaussianBlur in="n" stdDeviation="2.5" result="s"/>
    <feDisplacementMap in="SourceGraphic" in2="s" scale="46" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<header class="nav glass">
  <a class="mark" href="#" aria-label="Halcyon home"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 18c6-1 9-6 15-6 3 0 5 1 7 3l4-1-3 3c0 5-5 8-11 8-7 0-11-3-12-7z"/><path d="M12 17c3 2 7 2 10 0" class="wing"/></svg>Halcyon</a>
  <nav aria-label="Main"><a href="#places">Places</a><a href="#seat">The seat</a><a href="#">Club</a></nav>
  <a class="me" href="#">Sign in</a>
</header>

<section class="hero">
  <video class="film" muted loop playsinline preload="none" poster="media/film.jpg" aria-hidden="true">
    <source src="media/film.mp4" type="video/mp4">
  </video>
  <div class="veil"></div>
  <div class="copy">
    <h1><span>Fly somewhere</span> <span>that feels</span> <span>like June.</span></h1>
    <form class="ask glass" id="ask">
      <label class="sr" for="q">Describe the trip you want</label>
      <svg class="spark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c.6 4.6 2.4 7.4 10 10-7.6 2.6-9.4 5.4-10 10-.6-4.6-2.4-7.4-10-10 7.6-2.6 9.4-5.4 10-10z"/></svg>
      <input id="q" name="q" autocomplete="off" placeholder="Somewhere warm in March, good food, under $700">
      <button type="submit">Ask</button>
    </form>
    <div class="chips" aria-label="Try one">
      <button type="button">Warm in March, under $400</button>
      <button type="button">Snow, but cozy</button>
      <button type="button">A city that never sleeps</button>
      <button type="button">Long weekend, short flight</button>
    </div>
    <p class="answer glass" id="answer" role="status" hidden></p>
    <p class="how" id="how"></p>
  </div>
</section>

<section class="places" id="places">
  <h2>Six places, picked for how they feel.</h2>
  <div class="bento" id="bento"></div>
</section>

<section class="seat" id="seat">
  <div class="seat-pic"><img src="media/window.avif" alt="" loading="lazy"></div>
  <p class="seat-line">Every seat<br>is a window seat.</p>
</section>

<footer class="foot"><span>&copy; 2026 Halcyon</span><a href="#">Accessibility</a><a href="#">Privacy</a><span class="gen">Film and photos on this page are AI-generated.</span></footer>

</body>
</html>
