<SCRIPT LANGUAGE="JavaScript">
<!--
// in 1999 /cgi-bin/booking.pl printed this page on the server. here the browser does it
function getParam(name) {
  var q = location.search.substring(1).split("&");
  for (var i = 0; i < q.length; i++) {
    var p = q[i].split("=");
    if (p[0] == name) return unescape((p[1] || "").replace(/\+/g, " "));
  }
  return "";
}

var CITY = new Array();
CITY["TLV"] = "Tel Aviv"; CITY["LHR"] = "London"; CITY["CDG"] = "Paris";
CITY["JFK"] = "New York"; CITY["FCO"] = "Rome"; CITY["ATH"] = "Athens";
var HOURS = new Array();
HOURS["LHR"] = 5; HOURS["CDG"] = 5; HOURS["JFK"] = 11; HOURS["FCO"] = 4; HOURS["ATH"] = 2; HOURS["TLV"] = 5;
var FARE = new Array();
FARE["LHR"] = 399; FARE["CDG"] = 379; FARE["JFK"] = 699; FARE["FCO"] = 349; FARE["ATH"] = 199; FARE["TLV"] = 399;

// plenty of 1999 sites wrote these straight into the page, which is how they got defaced.
// this one only prints what it recognises
function clean(s, n) { return s.replace(/[^A-Za-z0-9]/g, "").substring(0, n); }
var from = getParam("from"), to = getParam("to");
if (typeof CITY[from] != "string") from = "TLV";
if (typeof CITY[to] != "string") to = "LHR";
var pax = parseInt(getParam("pax"), 10);
if (!(pax >= 1 && pax <= 5)) pax = 1;
var when = clean(getParam("mon"), 3) + " " + clean(getParam("day"), 2) + ", " + clean(getParam("yy"), 2);

function pad(n) { return n < 10 ? "0" + n : "" + n; }

function flightRows() {
  var dep = new Array(8, 13, 22), num = new Array(214, 216, 218), html = "";
  var hrs = HOURS[to == "TLV" ? from : to], fare = FARE[to == "TLV" ? from : to];
  for (var i = 0; i < 3; i++) {
    var arr = (dep[i] + hrs) % 24;
    var price = fare + (i == 1 ? 50 : (i == 2 ? -20 : 0)) * 1;
    html += "<TR BGCOLOR='" + (i % 2 ? "#EEEEFF" : "#FFFFFF") + "'>";
    html += "<TD><INPUT TYPE='radio' NAME='pick'" + (i == 0 ? " CHECKED" : "") + "></TD>";
    html += "<TD><B>HA " + num[i] + "</B></TD><TD>" + pad(dep[i]) + ":40</TD><TD>" + pad(arr) + ":55" + (dep[i] + hrs >= 24 ? " <FONT COLOR='#CC0000'>+1</FONT>" : "") + "</TD>";
    html += "<TD>Non-stop</TD><TD><B>$" + price * pax + "</B></TD></TR>";
  }
  return html;
}
//-->
</SCRIPT>
</HEAD>
